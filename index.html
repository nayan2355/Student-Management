<!DOCTYPE html>
<html>
<head>
<title>Student Management</title>
<style>
body{font-family:Arial; text-align:center; background:#f2f2f2}
form{margin:20px}
input{padding:8px; margin:5px}
button{padding:8px 15px; background:blue; color:white; border:none}
table{margin:auto; width:80%; background:white; border-collapse:collapse}
th,td{padding:10px; border:1px solid #ccc}
</style>
</head>
<body>
<h2>🎓 Student Management - Live Website</h2>
<form method="POST">
  <input name="name" placeholder="Name" required>
  <input name="roll" placeholder="Roll" required>
  <input name="course" placeholder="Course" required>
  <button>Add Student</button>
</form>
<table>
<tr><th>ID</th><th>Name</th><th>Roll</th><th>Course</th></tr>
{% for s in students %}
<tr><td>{{s[0]}}</td><td>{{s[1]}}</td><td>{{s[2]}}</td><td>{{s[3]}}</td></tr>
{% endfor %}
</table>
</body>
</html>
